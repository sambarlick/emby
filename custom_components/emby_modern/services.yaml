send_message:
  fields:
    message:
      required: true
      selector:
        text:
    header:
      required: false
      default: "Home Assistant Alert"
      selector:
        text:
    timeout_ms:
      required: false
      default: 5000
      selector:
        number:
          min: 1000
          max: 60000
          unit_of_measurement: ms
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: emby_modern
