name: Release

# Publishes a GitHub release for the version in manifest.json.
# Run manually: Actions -> Release -> Run workflow.
# Notes come from .github/release-notes/v<version>.md (required).
# Versions with a suffix (e.g. 1.3.0-beta-1) are published as pre-releases.

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: version
        run: |
          version=$(jq -r .version custom_components/emby_modern/manifest.json)
          tag="v$version"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if [[ "$version" == *-* ]]; then echo "pre=true" >> "$GITHUB_OUTPUT"; else echo "pre=false" >> "$GITHUB_OUTPUT"; fi
          echo "Version: $version"

      - name: Check release can be published
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::Release $TAG already exists. Bump the version in manifest.json first."
            exit 1
          fi
          if [[ ! -f ".github/release-notes/$TAG.md" ]]; then
            echo "::error::Missing release notes: .github/release-notes/$TAG.md"
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Run tests
        run: |
          if [[ -d tests ]]; then
            python -m pip install --quiet pytest-homeassistant-custom-component
            python -m pytest -q tests
          else
            echo "No tests folder, skipping."
          fi

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          PRE: ${{ steps.version.outputs.pre }}
        run: |
          notes=".github/release-notes/$TAG.md"
          # First line '# Title' is the release name; the rest is the body.
          title=$(head -n1 "$notes" | sed 's/^#\+ *//')
          tail -n +2 "$notes" > release-body.md
          args=(--target "$GITHUB_SHA" --title "$title" --notes-file release-body.md)
          if [[ "$PRE" == "true" ]]; then args+=(--prerelease); else args+=(--latest); fi
          gh release create "$TAG" "${args[@]}"